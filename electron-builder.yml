appId: io.ndna.harussh
productName: harussh
directories:
  output: release
  buildResources: build
# electron-vite bundles everything except `dependencies` into out/. So:
# - libraries used only by the bundled code (vue, @xterm/*) belong in
#   devDependencies and are not shipped in node_modules;
# - `dependencies` (ssh2, zod) are external to the bundle and electron-builder
#   copies them into the app, so keep this list minimal.
files:
  - out/**/*
  - package.json
# ssh2 works without its optional native addons (cpu-features / sshcrypto),
# so nothing is rebuilt for Electron and no compiler toolchain is needed.
npmRebuild: false
# Releases (and auto-updates) come from GitHub Releases. CI publishes them
# when a `v*` tag is pushed (see .github/workflows/release.yml).
publish:
  provider: github
  owner: Sturm
  repo: harussh
mac:
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  # zip is what the auto-updater downloads; dmg is for first installs.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - nsis
    - portable
# File names without spaces, since GitHub would rename them and break latest.yml.
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
linux:
  category: Development
  # .deb needs a maintainer; package.json's author has no email.
  maintainer: Hubert Rządziński
  target:
    - AppImage
    - deb
