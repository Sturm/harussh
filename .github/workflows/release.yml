name: Release

# Push a version tag to release:  npm version patch && git push --follow-tags
# Builds every platform, uploads to a draft GitHub release, then publishes it.
# Installed apps pick up the new version through the auto-updater.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Uploads installers and the latest*.yml files the auto-updater reads
      # into the draft created above.
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
